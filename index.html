<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volleyball Varsity Membership Verifier</title>
 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">


<link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
<script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

<style>
    body {
        font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        background-color: #f4f0fa;
    }
    .text-primary {
        color: #6f42c1 !important;
    }
    .btn-primary{
        background-color: #834896 !important;
        border-color: #834896 !important;
    }
    .btn-primary:hover {
        background-color: #9b6aab !important;
        border-color: #9d6aab !important;
    }
    .border-info {
        border-color: #9b6aab !important;
    }
</style>
</head>
<body class="bg-light d-flex justify-content-center align-items-center vh-100">

    <div class="card shadow p-4" style="max-width: 300px;  width: 100%;">
        <h3 class="text-center text-primary mb-3">Volleyball Varisty Verifier</h3>
        <p class="text-muted text-center">Enter your name to check if you are a member</p>

        <div class="mb-3">
            <label for="first_name" class="form-label">First name:</label>
            <input type="text" id="first_name" class="form-control" placeholder="e.g. Pauline">
        </div>

        <div class="mb-3">
            <label for="last_name" class="form-label">Last name:</label>
            <input type="text" id="last_name" class="form-control" placeholder="e.g. Chu Tan">
        </div>

        <button id="check_btn" class="btn btn-primary w-100 mb-3" py-click="check_membership">Check Membership</button>

        <div id="result" class="alert alert-info text-center d-none" role="alert"></div>
    </div>

    <script type="py" src="main.py"></script>
          
</body>
</html>
